<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>COC Backend</title>
    <style>
      body { margin: 0; padding: 32px; min-height: 100vh; box-sizing: border-box; display: grid; place-items: center; background: #f5f7f6; color: #24362d; font-family: system-ui, sans-serif; }
      main { width: min(100%, 520px); padding: 40px; box-sizing: border-box; background: white; border: 1px solid #e1e7e3; border-radius: 16px; }
      .label { color: #49765e; font-size: 12px; letter-spacing: 2px; }
      h1 { font-size: 28px; margin: 18px 0; }
      p { color: #718078; line-height: 1.8; }
    </style>
  </head>
  <body>
    <main>
      <span class="label">COC BACKEND</span>
      <h1>Django 기본 페이지</h1>
      <p>백엔드가 실행 중입니다.<br />필요한 기능을 이 구조에서 하나씩 추가하세요.</p>
    </main>
  </body>
</html>
