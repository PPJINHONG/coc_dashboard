# Compose 설정과 애플리케이션 이미지 빌드를 확인하는 기본 Workflow입니다.
name: Basic CI

# main 대상 PR, main에 반영된 코드, Actions 화면의 수동 실행에서 동작합니다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 저장소 코드를 읽는 최소 권한만 사용합니다.
permissions:
  contents: read

jobs:
  build:
    # main 보호 규칙에 등록할 때 사용할 검사 이름입니다.
    name: Compose build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # GitHub의 임시 실행 컴퓨터(runner)에 저장소 파일을 내려받습니다.
      # action은 v4.2.2의 커밋으로 고정했습니다.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # runner는 매번 새로 생성되므로 예시 환경값으로 빌드만 확인합니다.
      - name: Prepare example environment
        run: cp .env.example .env
      # 파일 문법, 필수 환경변수, 이미지 버전 참조가 올바른지 확인합니다.
      - name: Validate Compose configuration
        run: docker compose config --quiet
      # frontend/backend 이미지가 만들어지는지만 확인합니다.
      - name: Build application images
        run: docker compose build
