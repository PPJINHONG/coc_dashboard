# Compose 설정, 애플리케이션 이미지 빌드, 백엔드 테스트를 확인하는 기본 Workflow입니다.
name: Basic CI

# main 대상 PR, main에 반영된 코드, Actions 화면의 수동 실행에서 동작합니다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 저장소 코드를 읽는 최소 권한만 사용합니다.
permissions:
  contents: read

jobs:
  build:
    # main 보호 규칙에 등록할 때 사용할 검사 이름입니다.
    name: Compose build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # GitHub의 임시 실행 컴퓨터(runner)에 저장소 파일을 내려받습니다.
      # action은 v4.2.2의 커밋으로 고정했습니다.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # 실제 .env는 Git에 없으므로 빌드 검사용 임시 값만 만듭니다.
      - name: Prepare CI environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=coc_dashboard
          POSTGRES_USER=coc
          POSTGRES_PASSWORD=ci-only-password
          DJANGO_SECRET_KEY=ci-only-secret-key-not-used-anywhere-else
          EOF
      # 파일 문법, 필수 환경변수, 이미지 버전 참조가 올바른지 확인합니다.
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate production Compose configuration
        run: docker compose -f compose.prod.yaml config --quiet
      # frontend(TypeScript 검사 포함)/backend 이미지가 만들어지는지 확인합니다.
      - name: Build application images
        run: docker compose build
      # 임시 DB로 백엔드 테스트를 실행합니다. 두 브랜치의 마이그레이션이 갈라졌거나
      # 모델 변경에 마이그레이션이 빠졌으면 여기서 실패하므로 서버가 못 켜지는 변경을 병합 전에 막습니다.
      - name: Run backend tests
        run: |
          docker compose up -d --wait db
          docker compose run --rm --no-deps --entrypoint python backend -m pytest -q
      - name: Stop test database
        if: always()
        run: docker compose down
