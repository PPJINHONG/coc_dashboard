# 실행: docker compose up --build -d
name: coc-dashboard

services:
  # 기본 DB 설정만 사용하고 데이터는 볼륨에 보관합니다.
  db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 빈 DB 볼륨으로 처음 시작할 때 테이블과 샘플 데이터를 생성합니다.
      - ./db/init:/docker-entrypoint-initdb.d:ro

  # Django는 내부 backend:8000에서 실행하고 Nginx가 /api/ 요청을 전달합니다.
  backend:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - db

  # React + TypeScript 기본 페이지: http://localhost:8080
  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        NGINX_IMAGE: ${NGINX_IMAGE}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

# 컨테이너를 다시 만들어도 PostgreSQL 데이터가 유지됩니다.
volumes:
  postgres_data:
