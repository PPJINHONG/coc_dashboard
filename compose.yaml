# 로컬(개발) 실행 파일입니다. EC2 운영은 compose.prod.yaml을 사용합니다.
# 반영: git pull 후 docker compose down → docker compose up --build -d
# DB·첨부파일은 아래 Docker 볼륨에 남습니다. down -v는 볼륨(데이터)까지 지우므로 사용하지 않습니다.
# 서비스 설정을 바꿀 때는 compose.prod.yaml도 함께 바꿉니다.
name: coc-dashboard

services:
  # 기본 DB 설정만 사용하고 데이터는 볼륨에 보관합니다.
  db:
    # PostgreSQL 17 계열 유지. 메이저 버전 변경은 별도 데이터 이전 작업이 필요합니다.
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      # 최초 초기화용 임시 소켓 서버가 아닌 실제 TCP 서버가 준비될 때까지 기다립니다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 빈 DB 볼륨으로 처음 시작할 때 테이블·뷰 구조만 생성합니다.
      - ./db/init:/docker-entrypoint-initdb.d:ro

  # Django는 내부 backend:8000에서 실행하고 Nginx가 /api/ 요청을 전달합니다.
  backend:
    restart: unless-stopped
    stop_grace_period: 60s
    build:
      context: ./backend
      args:
        # Django 실행용 Python. 태그는 읽는 용도, @sha256은 정확한 이미지 고정용입니다.
        PYTHON_IMAGE: python:3.13.16-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEVELOPMENT_AUTH_BYPASS: ${DEVELOPMENT_AUTH_BYPASS:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/auth/csrf/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # React + TypeScript 기본 페이지: http://localhost:8080
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        # React 빌드용 Node.js(실행 컨테이너에는 포함되지 않음)와 정적 파일 제공용 Nginx
        NODE_IMAGE: node:24.21.0-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
        NGINX_IMAGE: nginx:1.30.5-alpine3.24@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

# 볼륨 이름을 고정해 어느 폴더에서 실행해도 같은 데이터를 사용합니다.
# 처음 실행할 때만 빈 볼륨을 자동으로 만들고, 이후에는 기존 볼륨을 그대로 연결합니다.
volumes:
  postgres_data:
    name: coc-dashboard_postgres_data
  media_data:
    name: coc-dashboard_media_data
