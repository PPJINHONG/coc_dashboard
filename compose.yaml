# 최초 설치: python3 tools/deploy.py init-storage
# 이후 배포: python3 tools/deploy.py deploy
# EC2는 .env의 COMPOSE_FILE=compose.yaml:compose.ec2.yaml로 고정 경로를 연결합니다.
name: coc-dashboard

services:
  # 기본 DB 설정만 사용하고 데이터는 볼륨에 보관합니다.
  db:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      # 최초 초기화용 임시 소켓 서버가 아닌 실제 TCP 서버가 준비될 때까지 기다립니다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 빈 DB 볼륨으로 처음 시작할 때 테이블·뷰 구조만 생성합니다.
      - ./db/init:/docker-entrypoint-initdb.d:ro

  # Django는 내부 backend:8000에서 실행하고 Nginx가 /api/ 요청을 전달합니다.
  backend:
    restart: unless-stopped
    stop_grace_period: 60s
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEVELOPMENT_AUTH_BYPASS: ${DEVELOPMENT_AUTH_BYPASS:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/auth/csrf/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # React + TypeScript 기본 페이지: http://localhost:8080
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        NGINX_IMAGE: ${NGINX_IMAGE}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

# 릴리스 폴더·Compose 프로젝트 이름과 별개로 같은 볼륨을 계속 사용합니다.
# 기본 DB 이름은 현재 로컬 볼륨과 동일합니다. 없는 볼륨은 자동 생성하지 않습니다.
# 외부 볼륨은 Compose 종료/재생성의 삭제 대상에서 제외됩니다.
volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:-coc-dashboard_postgres_data}
  media_data:
    external: true
    name: ${MEDIA_VOLUME_NAME:-coc-dashboard_media_data}
